name: release

# A tag `v<M.m.N>` names the version of all three apps built from a commit
# of main: M.m as apple/version.yaml states it, N the commit's ordinal on
# main, their build number. `make deploy` pushes it once ci is green there.
# Every green run on main has already put its builds in TestFlight, and
# promotion to the App Store is done by hand in App Store Connect, so this
# run only checks the tag and submits nothing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on main and state the version in the files
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          scripts/cut-release.sh --check "$GITHUB_REF_NAME"
      - name: Submit to the App Store
        run: echo "App Store submission is not implemented yet; nothing was submitted."
