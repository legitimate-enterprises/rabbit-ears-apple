name: release

# A tag names one app and its version, `<component>-v<version>`, and starts
# that app's upload to App Store Connect, where it lands in TestFlight; two
# tags pushed together are two runs. `make deploy <component>...` pushes
# them. An upload has no rollback: App Store Connect takes only a higher
# build number.
#
# The three apps reach App Store Connect the same way, so one job serves
# their tags: the component is the tag's name before `-v`.
on:
  push:
    tags: ['macos-v*', 'ios-v*', 'tvos-v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The runner image's default Xcode trails the one the apps are built with.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  app-store:
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
      MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
      PROVISIONING_PROFILE: >-
        ${{ startsWith(github.ref_name, 'macos-v') && secrets.MACOS_PROVISIONING_PROFILE ||
            startsWith(github.ref_name, 'ios-v') && secrets.IOS_PROVISIONING_PROFILE ||
            secrets.TVOS_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The scripts keep keys and profiles only in the temporary folder,
      # which here is the job's own and is emptied with it.
      - run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          case "${GITHUB_REF_NAME%%-v*}" in
            macos) platform=macOS ;;
            ios) platform=iOS ;;
            tvos) platform=tvOS ;;
          esac
          echo "COMPONENT=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_ENV"
          echo "PLATFORM=$platform" >> "$GITHUB_ENV"
      - uses: ./.github/actions/verify-release-preconditions
        with:
          github-token: ${{ github.token }}
      - name: Tag must state the version in the files
        run: scripts/cut-release.sh --check "$GITHUB_REF_NAME"
      # Before anything is imported or built, so a missing secret fails in
      # seconds and by name.
      - name: Release secrets must be set
        run: >-
          apple/scripts/require-env.sh APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID
          APPLE_API_ISSUER_ID APPLE_DISTRIBUTION_CERT_P12 APPLE_DISTRIBUTION_CERT_PASSWORD
          PROVISIONING_PROFILE
          ${{ startsWith(github.ref_name, 'macos-v') && 'MAC_INSTALLER_CERT_P12 MAC_INSTALLER_CERT_PASSWORD' || '' }}
      - run: apple/scripts/signing-keychain.sh "$PLATFORM"
      - run: make -C "$COMPONENT" deps
      - run: make -C "$COMPONENT" release
      - if: always()
        run: make -C "$COMPONENT" release-clean
