name: ci

# Every push runs every stack's chain of gates, each stack on its own: a
# stack's lint starts when that stack's style is green, whatever the other
# stacks are doing. stack.yaml is the chain; a red run names the stack and
# the gate in its title. A run on main whose gates are all green then
# uploads all three apps to App Store Connect, where they land in
# TestFlight.
#
# `branches` is spelled out: a bare `push:` also matches tags.
#
# One run at a time for a branch, so a burst of pushes does not queue macOS
# jobs behind each other. A push that arrives while another waits takes its
# place.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The kit's tests run in each app; the shared scripts' tests run here.
  apple:
    uses: ./.github/workflows/stack.yaml
    with:
      stack: apple
      tests: '["test-unit", "test-integration"]'

  macos:
    uses: ./.github/workflows/stack.yaml
    with:
      stack: macos
      tests: '["test-unit", "test-integration"]'

  ios:
    uses: ./.github/workflows/stack.yaml
    with:
      stack: ios
      tests: '["test-unit", "test-ui"]'

  tvos:
    uses: ./.github/workflows/stack.yaml
    with:
      stack: tvos
      tests: '["test-unit", "test-ui"]'

  # Starts only when every stack's gates are green; a failed upload turns
  # the run red. The only job that sees the release secrets.
  testflight:
    name: testflight ${{ matrix.app }}
    needs: [apple, macos, ios, tvos]
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: macos, platform: macOS }
          - { app: ios, platform: iOS }
          - { app: tvos, platform: tvOS }
    env:
      # The runner image's default Xcode trails the one the apps are built with.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
      MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
      PROVISIONING_PROFILE: >-
        ${{ matrix.app == 'macos' && secrets.MACOS_PROVISIONING_PROFILE ||
            matrix.app == 'ios' && secrets.IOS_PROVISIONING_PROFILE ||
            secrets.TVOS_PROVISIONING_PROFILE }}
      COMPONENT: ${{ matrix.app }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The scripts keep keys and profiles only in the temporary folder,
      # which here is the job's own and is emptied with it.
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Before anything is imported or built, so a missing secret fails in
      # seconds and by name.
      - name: Release secrets must be set
        run: >-
          apple/scripts/require-env.sh APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID
          APPLE_API_ISSUER_ID APPLE_DISTRIBUTION_CERT_P12 APPLE_DISTRIBUTION_CERT_PASSWORD
          PROVISIONING_PROFILE
          ${{ matrix.app == 'macos' && 'MAC_INSTALLER_CERT_P12 MAC_INSTALLER_CERT_PASSWORD' || '' }}
      - run: apple/scripts/signing-keychain.sh "$PLATFORM"
      - run: make -C "$COMPONENT" deps
      - run: make -C "$COMPONENT" release
      - if: always()
        run: make -C "$COMPONENT" release-clean
